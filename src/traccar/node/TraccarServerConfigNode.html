<script type="text/javascript" template-section="onCompose">
    node
        .addDefault("name",         { value: "Traccar Server", required: true })
        .addDefault("url",          { value: "http://traccar.example.com", required: true })
        .addDefault("username",     { value: "", required: true })
        .addDefault("password",     { value: "", required: true })
        .addDefault("cacheTimeout", { value: 5, required: true })
        .setPaletteLabel("Traccar Server Config")
        .setLabel(function() { return this.name; })
        .setColor("#1E88E5")
</script>

<script type="text/javascript" template-section="onIncludeEditPrepare">
{
    let node = this;

    $("#traccar-reload-cache-btn").on("click", function() {
        var $btn = $(this);
        var $status = $("#traccar-reload-cache-status");
        $status.text("Reloading...").css("color", "gray");
        $btn.prop("disabled", true);

        $.ajax({
            url: "traccarservice/reloadcache",
            type: "POST",
            contentType: "application/json; charset=utf-8",
            data: JSON.stringify({ nodeId: node.id }),
            success: function(response) {
                $status.text("\u2714 " + response.message).css("color", "green");
            },
            error: function(jqXHR) {
                var msg = "Reload failed";
                try { var body = JSON.parse(jqXHR.responseText); if (body.error) msg = body.error; } catch(e) {}
                $status.text("\u2718 " + msg).css("color", "red");
            },
            complete: function() { $btn.prop("disabled", false); }
        });
    });

    $("#traccar-test-connection-btn").on("click", function() {
        var $btn = $(this);
        var $status = $("#traccar-test-connection-status");
        $status.text("Testing...").css("color", "gray");
        $btn.prop("disabled", true);

        $.ajax({
            url: "traccarservice/testconnection",
            type: "POST",
            contentType: "application/json; charset=utf-8",
            data: JSON.stringify({
                url:      $("#node-config-input-url").val(),
                username: $("#node-config-input-username").val(),
                password: $("#node-config-input-password").val(),
            }),
            success: function() {
                $status.text("\u2714 Connection successful").css("color", "green");
            },
            error: function(jqXHR) {
                var msg = "Connection failed";
                try { var body = JSON.parse(jqXHR.responseText); if (body.error) msg = body.error; } catch(e) {}
                $status.text("\u2718 " + msg).css("color", "red");
            },
            complete: function() { $btn.prop("disabled", false); }
        });
    });
}
</script>

        <button type="button" id="traccar-reload-cache-btn" class="red-ui-button">

        </button>
        <span id="traccar-reload-cache-status" style="margin-left:10px; font-size:12px;"></span>
    </div>
</script>

<script type="text/markdown" template-section="onIncludeDocumentation">
Connection configuration for a Traccar GPS tracking server. Referenced by all Traccar nodes.

### Properties

: *name*          (string) : Display label for this config.
: *url*           (string) : The base URL of the Traccar server, e.g. `http://traccar.example.com` or `https://demo.traccar.org`.
: *username*      (string) : Traccar account username (email address).
: *password*      (string) : Traccar account password.
: *cache timeout* (number) : How long (in minutes) to cache device and group data locally before re-fetching from the server. Defaults to 5 minutes. Set to `0` to always fetch fresh data. Use the **Reload Cache** button to force an immediate refresh without waiting for the timeout.

### Details

On deployment the node connects to the Traccar server, loads devices and groups into its internal cache, and opens a WebSocket subscription for live position updates. All Traccar Event and Get Device Location nodes that reference this config share the same connection.

### References
- [Traccar](https://www.traccar.org/)
- [Traccar API](https://www.traccar.org/traccar-api/)
</script>
